name: kanban-app

services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-inclusionai/ling-3.2-flash:free}
    volumes:
      - kanban-data:/data

volumes:
  kanban-data:
