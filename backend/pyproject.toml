[project]
name = "kanban-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["authlib", "fastapi", "httpx2", "itsdangerous", "psycopg[binary]", "uvicorn"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python build_frontend.py"
